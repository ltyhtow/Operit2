name: Operit2 Personal ARM64 APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-arm64-personal-build.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Upstream commit, branch, or tag to build"
        required: true
        default: "3dfda18f1a15951a297241f9fcbd847fb4ba570f"
        type: string

permissions:
  contents: read

jobs:
  build-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: AAswordman/Operit2
          ref: ${{ inputs.source_ref || '3dfda18f1a15951a297241f9fcbd847fb4ba570f' }}

      - name: Record upstream source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Android runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            curl \
            diffutils \
            flex \
            gawk \
            gzip \
            patch \
            pkg-config \
            tar \
            unzip \
            xz-utils

      - name: Fetch Android runtime sources
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload Android terminal runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime-${{ steps.source.outputs.sha }}
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 1

  build-android:
    needs: build-android-runtime
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: AAswordman/Operit2
          ref: ${{ needs.build-android-runtime.outputs.source_sha }}

      - name: Download Android terminal runtime
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime-${{ needs.build-android-runtime.outputs.source_sha }}
          path: apps/flutter/app/android/app/src/main

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare plugin build tools
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Install isolated shims so the runner's preinstalled Yarn is untouched.
          npm install --prefix .ci-tools/corepack --no-audit --no-fund corepack@0.34.6
          $corepackBin = (Resolve-Path .ci-tools/corepack/node_modules/.bin).Path
          $env:PATH = "$corepackBin;$env:PATH"
          $corepackBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          corepack enable pnpm --install-directory $corepackBin
          corepack --version
          corepack pnpm --version
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          python -m venv .venv

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Prepare Android bindgen libclang
        shell: pwsh
        run: |
          $version = "21.1.8"
          $packageName = "libclang.runtime.win-x64.$version"
          $toolsDir = "target/operit-build-tools"
          $packageDir = Join-Path $toolsDir $packageName
          $archive = Join-Path $toolsDir "$packageName.nupkg"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/libclang.runtime.win-x64/$version" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $packageDir -Force
          $libclang = Join-Path $packageDir "runtimes/win-x64/native/libclang.dll"
          if (-not (Test-Path -LiteralPath $libclang)) {
            throw "Android bindgen libclang was not prepared at $libclang"
          }

      - name: Restore Android signing material
        shell: pwsh
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPERIT_PERSONAL_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.OPERIT_PERSONAL_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.OPERIT_PERSONAL_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.OPERIT_PERSONAL_KEY_PASSWORD }}
        run: |
          $required = @(
            "ANDROID_RELEASE_KEYSTORE_BASE64",
            "ANDROID_RELEASE_STORE_PASSWORD",
            "ANDROID_RELEASE_KEY_ALIAS",
            "ANDROID_RELEASE_KEY_PASSWORD"
          )
          $provided = @($required | Where-Object { -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          $secretsDir = "tools/release/secrets"
          New-Item -ItemType Directory -Force -Path $secretsDir | Out-Null
          $keystore = Join-Path $secretsDir "operit2-release.keystore"
          if ($provided.Count -eq 0) {
            # One personal build: create its certificate inside the runner.
            # Signing keys and passwords are excluded from the APK artifact.
            $password = [Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
            Write-Output "::add-mask::$password"
            $env:ANDROID_RELEASE_STORE_PASSWORD = $password
            $env:ANDROID_RELEASE_KEY_PASSWORD = $password
            $env:ANDROID_RELEASE_KEY_ALIAS = "operit-personal"
            keytool -genkeypair -keystore $keystore -storetype PKCS12 -alias operit-personal -keyalg RSA -keysize 3072 -validity 10000 -storepass:env ANDROID_RELEASE_STORE_PASSWORD -keypass:env ANDROID_RELEASE_KEY_PASSWORD -dname "CN=Operit2 Personal Build" -noprompt
            if ($LASTEXITCODE -ne 0) { throw "Personal signing certificate generation failed" }
          } elseif ($provided.Count -eq $required.Count) {
            [System.IO.File]::WriteAllBytes($keystore, [System.Convert]::FromBase64String($env:ANDROID_RELEASE_KEYSTORE_BASE64))
          } else {
            throw "Personal signing secrets are incomplete; provide all four or none"
          }
          @"
          RELEASE_STORE_FILE=operit2-release.keystore
          RELEASE_STORE_PASSWORD=$env:ANDROID_RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$env:ANDROID_RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$env:ANDROID_RELEASE_KEY_PASSWORD
          "@ | Set-Content -Path (Join-Path $secretsDir "android-signing.properties") -Encoding utf8

      - name: Cache source-built Android V8
        uses: actions/cache@v4
        with:
          path: tools/release/work/android-v8
          key: ${{ runner.os }}-${{ runner.arch }}-android-v8-${{ hashFiles('tools/build_scripts/prepare_android_v8.py', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock') }}

      - name: Check build environment
        shell: pwsh
        run: python tools/build_scripts/check_build_environment.py --products app --github-runner

      - name: Generate embedded plugin assets
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Proxy codegen compiles operit-runtime and requires these archives first.
          .venv/Scripts/python.exe plugins/tools/sync_plugin_packages.py --source runtime --no-hot-reload

      - name: Build and package Android app
        shell: pwsh
        run: |
          $version = (Select-String -Path apps/flutter/app/pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$').Matches
          if ($version.Count -ne 1) {
            throw "apps/flutter/app/pubspec.yaml must contain exactly one release version line"
          }
          python tools/build_scripts/build_flutter_android.py --build-name $version[0].Groups[1].Value --build-number $version[0].Groups[2].Value --enforce-lockfile

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-arm64-${{ needs.build-android-runtime.outputs.source_sha }}
          path: tools/release/dist/operit2-app-android-arm64-v8a-*.apk
          if-no-files-found: error
          retention-days: 14


      - name: Record APK source and digest
        shell: pwsh
        env:
          OPERIT_SOURCE_SHA: ${{ needs.build-android-runtime.outputs.source_sha }}
        run: |
          "Source: AAswordman/Operit2@$env:OPERIT_SOURCE_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Architecture: arm64-v8a; personal signing certificate" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem tools/release/dist/operit2-app-android-arm64-v8a-*.apk | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$($_.Name) SHA256: $hash" >> $env:GITHUB_STEP_SUMMARY
          }
